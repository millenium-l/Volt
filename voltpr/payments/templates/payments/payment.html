{% extends 'base.html' %}

{% block title %}Payment | VoltVibe{% endblock %}

{% block content %}
<main class="container my-5" style="max-width: 640px;">
    <section class="p-4 bg-white rounded-3 shadow-sm">
        <h1 class="h4 fw-bold">Complete payment</h1>
        <p class="text-muted">You will receive an M-Pesa prompt on your phone.</p>
        <p class="fs-5 fw-bold">Order total: KES {{ total }}</p>
        <form method="post" action="{% url 'payments:initiate' order.id %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-primary w-100">Send M-Pesa prompt</button>
        </form>
    </section>
</main>
{% endblock %}
